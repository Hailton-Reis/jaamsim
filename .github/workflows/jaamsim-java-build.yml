name: JaamSim native assistant build candidate

on:
  pull_request:
    paths:
      - "src/main/java/**"
      - "src/test/java/**"
      - "src/main/java25/**"
      - "extensions/academic-assistant/python/**"
      - "build.xml"
      - "scripts/build.sh"
      - "scripts/package_native_candidate.py"
      - ".github/workflows/jaamsim-java-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-java25:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Ensure Apache Ant
        shell: bash
        run: |
          if ! command -v ant >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ant
          fi
          java -version
          ant -version
      - name: Build native JaamSim assistant
        shell: bash
        run: bash scripts/build.sh
      - name: Verify candidate classes
        shell: bash
        run: |
          set -euo pipefail
          jar_file="build/jars/JaamSim2026-03.jar"
          test -s "$jar_file"
          jar tf "$jar_file" | grep -qx "com/jaamsim/ui/AIAssistantBox.class"
          jar tf "$jar_file" | grep -qx "com/jaamsim/ui/StatFitAssistantBox.class"
          jar tf "$jar_file" | grep -qx "com/jaamsim/ui/C2PreflightPanel.class"
          jar tf "$jar_file" | grep -qx "com/jaamsim/ui/C2PreflightRunner.class"
          echo "CANDIDATE_BUILT_NO_GUI_ACCEPTANCE $(sha256sum "$jar_file")"
      - name: Check RCL report provenance contract (headless)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/test-classes
          javac -encoding UTF-8 -cp build/jars/JaamSim2026-03.jar \
            -d build/test-classes \
            src/test/java/com/jaamsim/ui/OfflineRclReportContractTest.java \
            src/test/java/com/jaamsim/ui/StatFitRunArtifactsContractTest.java \
            src/test/java/com/jaamsim/ui/C2PreflightRunnerContractTest.java \
            src/test/java/com/jaamsim/ui/C2PythonInteropContractTest.java
          java -Djava.awt.headless=true \
            -cp "build/test-classes:build/jars/JaamSim2026-03.jar" \
            com.jaamsim.ui.OfflineRclReportContractTest
          java -Djava.awt.headless=true \
            -cp "build/test-classes:build/jars/JaamSim2026-03.jar" \
            com.jaamsim.ui.StatFitRunArtifactsContractTest
          java -Djava.awt.headless=true \
            -cp "build/test-classes:build/jars/JaamSim2026-03.jar" \
            com.jaamsim.ui.C2PreflightRunnerContractTest
          java -Djava.awt.headless=true \
            -cp "build/test-classes:build/jars/JaamSim2026-03.jar" \
            com.jaamsim.ui.C2PythonInteropContractTest python3
      - name: C2 real Swing virtual-desktop preflight (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y xvfb xauth
          fi
          javac -encoding UTF-8 -cp build/jars/JaamSim2026-03.jar \
            -d build/test-classes \
            src/test/java/com/jaamsim/ui/C2PreflightSwingSmokeTest.java
          mkdir -p build/c2-gui-evidence
          xvfb-run -a -s "-screen 0 1280x960x24" java -Djava.awt.headless=false \
            -cp "build/test-classes:build/jars/JaamSim2026-03.jar" \
            com.jaamsim.ui.C2PreflightSwingSmokeTest \
            "$PWD/extensions/academic-assistant" "$(command -v python3)" "$PWD/build/c2-gui-evidence"
      - name: Upload synthetic GUI screenshots (not Windows acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-gui-virtual-screen-evidence
          path: build/c2-gui-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Package native candidate with Python support
        shell: bash
        run: python3 scripts/package_native_candidate.py
      - name: Upload standalone review package (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: jaam-ai-native-module
          path: build/dist/jaam-ai-native-candidate.zip
          retention-days: 7
      - name: Upload unvalidated candidate JAR separately
        uses: actions/upload-artifact@v4
        with:
          name: jaamsim-native-candidate
          path: build/jars/JaamSim2026-03.jar
          retention-days: 7

  c2-windows-headless:
    name: Windows C2 Swing component + Python subprocess (headless)
    needs: compile-java25
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: jaamsim-native-candidate
          path: build/jars
      - name: Validate Windows JPanel / C2 process with synthetic corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/test-classes | Out-Null
          New-Item -ItemType Directory -Force -Path build/c2-gui-evidence | Out-Null
          & javac -encoding UTF-8 -cp "build/jars/JaamSim2026-03.jar" -d "build/test-classes" "src/test/java/com/jaamsim/ui/C2PreflightSwingSmokeTest.java"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assistantRoot = Join-Path $env:GITHUB_WORKSPACE "extensions/academic-assistant"
          $python = (Get-Command python).Source
          $evidence = Join-Path $env:GITHUB_WORKSPACE "build/c2-gui-evidence"
          & java "-Djava.awt.headless=true" "-cp" "build/test-classes;build/jars/JaamSim2026-03.jar" "com.jaamsim.ui.C2PreflightSwingSmokeTest" $assistantRoot $python $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
