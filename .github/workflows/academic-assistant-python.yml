name: Academic Assistant Python regression

on:
  pull_request:
    paths:
      - "extensions/academic-assistant/python/**"
      - "extensions/academic-assistant/requirements-dev.txt"
      - "extensions/academic-assistant/pytest.ini"
      - ".github/workflows/academic-assistant-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: extensions/academic-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline regression suite
        run: python -m pytest
