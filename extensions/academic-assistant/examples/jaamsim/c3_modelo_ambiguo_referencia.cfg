RecordEdits

# ASSUMPTION: A decisao de qualidade reprova 12% dos itens.
# ASSUMPTION: Itens reprovados retornam ao processo principal apos retrabalho.
# ASSUMPTION: Itens aprovados saem do sistema.

Define ExponentialDistribution { IATDistribution }
Define DiscreteDistribution { DecisaoQualidadeDist }
Define EntityConveyor { ConveyorEntrada ConveyorParaDecisao ConveyorAprovados ConveyorRetrabalho ConveyorRetorno }
Define EntityGenerator { EntradaItens }
Define EntitySink { SaidaAprovados }
Define Queue { FilaProcesso FilaRetrabalho }
Define Server { ProcessoPrincipal Retrabalho }
Define Branch { DecisaoQualidade }
Define SimEntity { Item }
Define Text { MetricTempoCiclo MetricItensAprovados MetricTaxaRetrabalho }

IATDistribution UnitType { TimeUnit }

Simulation Description { 'C3 modelo ambiguo referencia - retrabalho com premissas documentadas' }
Simulation RunDuration { 30 s }
Simulation ExitAtStop { TRUE }
Simulation RunOutputList { { [SaidaAprovados].NumberProcessed } { [FilaProcesso].AverageQueueTime/1[s] } { [Retrabalho].NumberProcessed } }

IATDistribution RandomSeed { 3 }
IATDistribution Mean { 1 s }

DecisaoQualidadeDist RandomSeed { 4 }
DecisaoQualidadeDist UnitType { DimensionlessUnit }
DecisaoQualidadeDist ValueList { 1 2 }
DecisaoQualidadeDist ProbabilityList { 0.88 0.12 }

ConveyorEntrada NextComponent { FilaProcesso }
ConveyorEntrada TravelTime { 0 s }

ConveyorParaDecisao NextComponent { DecisaoQualidade }
ConveyorParaDecisao TravelTime { 0 s }

ConveyorAprovados NextComponent { SaidaAprovados }
ConveyorAprovados TravelTime { 0 s }

ConveyorRetrabalho NextComponent { FilaRetrabalho }
ConveyorRetrabalho TravelTime { 0 s }

ConveyorRetorno NextComponent { FilaProcesso }
ConveyorRetorno TravelTime { 0 s }

EntradaItens NextComponent { ConveyorEntrada }
EntradaItens InterArrivalTime { IATDistribution }
EntradaItens PrototypeEntity { Item }
EntradaItens BaseName { Item }

ProcessoPrincipal NextComponent { ConveyorParaDecisao }
ProcessoPrincipal WaitQueue { FilaProcesso }
ProcessoPrincipal ServiceTime { 0.8 s }

DecisaoQualidade NextComponentList { ConveyorAprovados ConveyorRetrabalho }
DecisaoQualidade Choice { DecisaoQualidadeDist }

Retrabalho NextComponent { ConveyorRetorno }
Retrabalho WaitQueue { FilaRetrabalho }
Retrabalho ServiceTime { 0.5 s }

MetricTempoCiclo Format { 'Tempo de ciclo = %.2f s' }
MetricTempoCiclo DataSource { [FilaProcesso].AverageQueueTime }

MetricItensAprovados Format { 'Itens aprovados = %,.0f' }
MetricItensAprovados DataSource { [SaidaAprovados].NumberProcessed }

MetricTaxaRetrabalho Format { 'Taxa de retrabalho = %,.0f' }
MetricTaxaRetrabalho DataSource { [Retrabalho].NumberProcessed }
