RecordEdits

# ASSUMPTION: A inspecao ocorre somente apos o processamento principal.
# ASSUMPTION: Itens aprovados saem do sistema.

Define ExponentialDistribution { IATDistribution }
Define EntityConveyor { ConveyorEntrada ConveyorParaFilaProcessamento ConveyorParaFilaInspecao ConveyorSaida }
Define EntityGenerator { EntradaItens }
Define EntitySink { SaidaItens }
Define Queue { FilaPreparacao FilaProcessamento FilaInspecao }
Define Server { Preparacao Processamento Inspecao }
Define SimEntity { Item }
Define Text { MetricThroughput MetricTempoCiclo MetricUtilizacaoMaquina }

IATDistribution UnitType { TimeUnit }

Simulation Description { 'C2 processo sequencial referencia - rascunho cfg para validacao no JaamSim' }
Simulation RunDuration { 20 s }
Simulation ExitAtStop { TRUE }
Simulation RunOutputList { { [FilaProcessamento].NumberProcessed } { [FilaPreparacao].AverageQueueTime/1[s] } { [Processamento].Utilisation } }

IATDistribution RandomSeed { 2 }
IATDistribution Mean { 1 s }

ConveyorEntrada NextComponent { FilaPreparacao }
ConveyorEntrada TravelTime { 0 s }

ConveyorParaFilaProcessamento NextComponent { FilaProcessamento }
ConveyorParaFilaProcessamento TravelTime { 0 s }

ConveyorParaFilaInspecao NextComponent { FilaInspecao }
ConveyorParaFilaInspecao TravelTime { 0 s }

ConveyorSaida NextComponent { SaidaItens }
ConveyorSaida TravelTime { 0 s }

EntradaItens NextComponent { ConveyorEntrada }
EntradaItens InterArrivalTime { IATDistribution }
EntradaItens PrototypeEntity { Item }
EntradaItens BaseName { Item }

Preparacao NextComponent { ConveyorParaFilaProcessamento }
Preparacao WaitQueue { FilaPreparacao }
Preparacao ServiceTime { 0.6 s }

Processamento NextComponent { ConveyorParaFilaInspecao }
Processamento WaitQueue { FilaProcessamento }
Processamento ServiceTime { 0.9 s }

Inspecao NextComponent { ConveyorSaida }
Inspecao WaitQueue { FilaInspecao }
Inspecao ServiceTime { 0.4 s }

MetricThroughput Format { 'Throughput = %,.0f' }
MetricThroughput DataSource { [FilaProcessamento].NumberProcessed }

MetricTempoCiclo Format { 'Tempo de ciclo = %.2f s' }
MetricTempoCiclo DataSource { [FilaPreparacao].AverageQueueTime }

MetricUtilizacaoMaquina Format { 'Utilizacao da maquina = %.2f' }
MetricUtilizacaoMaquina DataSource { [Processamento].Utilisation }
